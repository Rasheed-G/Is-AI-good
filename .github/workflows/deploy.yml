name: Publish & deploy

# The editorial gate + site build, committed back so the static host redeploys.
#   publish.py  -> Approved and (auto) Safe Candidates become Published; Sensitive held
#   build_data.py -> pulls Published rows into site/stories.json, and the rulebook themes into site/themes.json
#   build_frame.py -> keeps the theme list on How we choose stories in step with the rulebook
#   commit      -> pushing site/stories.json triggers the host's auto-deploy
#
# Runs:
#   * after the weekly pick completes (workflow_run) — the week's stories go live promptly
#   * once a day (schedule, 06:00 UTC) — picks up manual approvals of Sensitive
#     items and removals (Status set to Rejected) made in Airtable between weekly picks.
#     A rebuild re-reads every story (several Airtable requests) and the Free plan limits
#     requests per month, so the daily run first asks one question (stories_changed.py:
#     has any story been edited since the last rebuild?) and rebuilds only if so.
#   * on demand (workflow_dispatch) — e.g. to push a removal live immediately
#
# HOST WIRING (one-time, owner, host-side — no code here): connect the repo to a
# free static host (Cloudflare Pages / Netlify / Vercel), set the site directory
# to `site/`, no build command. Each commit this workflow pushes then auto-deploys.
on:
  workflow_run:
    workflows: ["Weekly pick"]   # v3: only the weekly pick writes new stories
    types: [completed]
  schedule:
    - cron: "23 6 * * *"
  # Odd minute on purpose: GitHub delays scheduled runs set on the hour (by up to 6+ hours).
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: publish-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # The publish commit must clear main's protection (changes go via a PR). The default bot can't, so the
      # push uses a 1-hour token from the repo's own GitHub App, which is allowed to bypass that rule and never
      # expires. Until the app is set up (repo variable PUBLISH_APP_CLIENT_ID and secret PUBLISH_APP_KEY), the
      # owner's personal token (PUBLISH_TOKEN) is used as before.
      - name: Token from the publishing app
        id: app
        if: vars.PUBLISH_APP_CLIENT_ID != ''
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.PUBLISH_APP_CLIENT_ID }}
          private-key: ${{ secrets.PUBLISH_APP_KEY }}
          owner: ${{ github.repository_owner }}   # every repo the app is installed on (this one and the archive)
      - uses: actions/checkout@v4
        with:
          token: ${{ steps.app.outputs.token || secrets.PUBLISH_TOKEN }}
          fetch-depth: 100      # enough history to find when site/stories.json last changed
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Any story edited since the last rebuild? (daily run only)
        id: check
        if: github.event_name == 'schedule'
        env:
          AIRTABLE_TOKEN: ${{ secrets.AIRTABLE_TOKEN }}
        run: python -u scripts/stories_changed.py
      - name: Publish (editorial gate)
        if: github.event_name != 'schedule' || steps.check.outputs.changed == 'true'
        env:
          AIRTABLE_TOKEN: ${{ secrets.AIRTABLE_TOKEN }}
          AUTOPUBLISH: "1"
          PYTHONUNBUFFERED: "1"
        run: python -u scripts/publish.py
      - name: Build site data
        if: github.event_name != 'schedule' || steps.check.outputs.changed == 'true'
        # Gallery limits on: at most 20 stories per theme, none older than 6 months (rulebook section 4).
        # Stories they leave out are archived with every field to the archive repo, then removed from Airtable.
        env:
          AIRTABLE_TOKEN: ${{ secrets.AIRTABLE_TOKEN }}
          GALLERY_LIMITS: "1"
          GALLERY_ARCHIVE: "1"
          ARCHIVE_REPO: ${{ secrets.ARCHIVE_REPO }}
          ARCHIVE_PATH: ${{ secrets.ARCHIVE_PATH }}
          ARCHIVE_TOKEN: ${{ steps.app.outputs.token || secrets.ARCHIVE_TOKEN || secrets.PUBLISH_TOKEN }}
          PYTHONUNBUFFERED: "1"
        run: python -u scripts/build_data.py
      - name: Theme list on How we choose stories (from the rulebook)
        if: github.event_name != 'schedule' || steps.check.outputs.changed == 'true'
        run: python -u scripts/build_frame.py
      - name: Commit refreshed stories.json (triggers host deploy)
        if: github.event_name != 'schedule' || steps.check.outputs.changed == 'true'
        # NOTE: no [skip ci] in the message. Cloudflare Pages treats [skip ci] as a
        # skip-build token, which suppressed the very deploy this commit exists to fire.
        # No workflow here triggers on: push, so there is no Actions loop to guard against.
        run: |
          git config user.name "harvest-bot"
          git config user.email "actions@users.noreply.github.com"
          git add site/stories.json site/themes.json site/how-we-choose/index.html
          git diff --cached --quiet || git commit -m "Auto: refresh published stories"
          git push
