name: Publish & deploy

# The editorial gate + site build, committed back so the static host redeploys.
#   publish.py  -> Approved and (auto) Safe Candidates become Published; Sensitive held
#   build_data.py -> pulls Published rows into site/stories.json, and the rulebook themes into site/themes.json
#   build_frame.py -> keeps the theme list on How we choose stories in step with the rulebook
#   commit      -> pushing site/stories.json triggers the host's auto-deploy
#
# Runs:
#   * after the weekly pick completes (workflow_run) — the week's stories go live promptly
#   * once a day (schedule, 06:00 UTC) — picks up manual approvals of Sensitive
#     items and removals (Status set to Rejected) made in Airtable between harvests.
#     Was every 6 hours, but each run re-reads the whole Published table (~8 Airtable
#     calls at 100 rows/page), so 4×/day was the top Airtable API-call consumer and
#     pushed the Free-plan workspace over its monthly limit. Once daily keeps us well
#     under; new harvested content still ships promptly via the workflow_run trigger,
#     and an urgent manual edit can go live at once via workflow_dispatch below.
#   * on demand (workflow_dispatch) — e.g. to push a removal live immediately
#
# HOST WIRING (one-time, owner, host-side — no code here): connect the repo to a
# free static host (Cloudflare Pages / Netlify / Vercel), set the site directory
# to `site/`, no build command. Each commit this workflow pushes then auto-deploys.
on:
  workflow_run:
    workflows: ["Weekly pick"]   # v3: only the weekly pick writes new stories
    types: [completed]
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: publish-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        # Push as the repo owner (PUBLISH_TOKEN) so the auto-publish commit clears
        # main's branch protection. The default bot push is rejected ("must go via a
        # PR"), and personal repos can't grant a bot bypass, so the owner token stands in.
        with:
          token: ${{ secrets.PUBLISH_TOKEN }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Publish (editorial gate)
        env:
          AIRTABLE_TOKEN: ${{ secrets.AIRTABLE_TOKEN }}
          AUTOPUBLISH: "1"
          PYTHONUNBUFFERED: "1"
        run: python -u scripts/publish.py
      - name: Build site data
        # Gallery limits on: at most 20 stories per theme, none older than 6 months (rulebook section 4).
        # Stories they leave out are archived with every field to the archive repo, then removed from Airtable.
        env:
          AIRTABLE_TOKEN: ${{ secrets.AIRTABLE_TOKEN }}
          GALLERY_LIMITS: "1"
          GALLERY_ARCHIVE: "1"
          ARCHIVE_REPO: ${{ secrets.ARCHIVE_REPO }}
          ARCHIVE_PATH: ${{ secrets.ARCHIVE_PATH }}
          ARCHIVE_TOKEN: ${{ secrets.ARCHIVE_TOKEN || secrets.PUBLISH_TOKEN }}
          PYTHONUNBUFFERED: "1"
        run: python -u scripts/build_data.py
      - name: Theme list on How we choose stories (from the rulebook)
        run: python -u scripts/build_frame.py
      - name: Commit refreshed stories.json (triggers host deploy)
        # NOTE: no [skip ci] in the message. Cloudflare Pages treats [skip ci] as a
        # skip-build token, which suppressed the very deploy this commit exists to fire.
        # No workflow here triggers on: push, so there is no Actions loop to guard against.
        run: |
          git config user.name "harvest-bot"
          git config user.email "actions@users.noreply.github.com"
          git add site/stories.json site/themes.json site/how-we-choose/index.html
          git diff --cached --quiet || git commit -m "Auto: refresh published stories"
          git push
