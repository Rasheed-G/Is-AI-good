name: Batch test
on:
  workflow_dispatch: {}
jobs:
  batchtest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Judge batch A/B v2 (fuller bodies, batch 3/4, variance)
        env:
          AIRTABLE_TOKEN: ${{ secrets.AIRTABLE_TOKEN }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          PYTHONUNBUFFERED: "1"
        run: python -u scripts/batch_test.py
