name: Weekly sweep

# Once a week: the "top of the week" backstop that catches anything the daily
# runs missed (dedupe prevents repeats). Sunday 02:00 UTC. Also runnable on demand.
on:
  schedule:
    - cron: "0 2 * * 0"
  workflow_dispatch: {}

jobs:
  sweep:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run weekly top-of-week sweep
        env:
          AIRTABLE_TOKEN: ${{ secrets.AIRTABLE_TOKEN }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          SWEEP: "1"
          PYTHONUNBUFFERED: "1"
        run: python -u scripts/harvest_reddit.py
# Weekly top-of-week sweep for AI Harm Watch.
