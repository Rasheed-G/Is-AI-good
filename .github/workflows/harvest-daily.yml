name: Daily harvest

# Runs every night MON–SAT over ALL sources, looking at the last 2 days of content.
# 01:00 UTC ≈ 1–2 am London (shifts an hour with British Summer Time).
# SUNDAY is deliberately skipped: the Weekly sweep runs Sunday 02:00 UTC over a 7-day
# window (which already covers Sunday's daily) — and running BOTH on the same UTC day
# would stack their judge-model token usage past its 200K/day bucket (a single daily
# run already uses ~155K). Mon–Sat daily + Sun sweep keeps the two runs on separate days.
# Also runnable on demand from the Actions tab (workflow_dispatch).
on:
  schedule:
    - cron: "0 1 * * 1-6"
  workflow_dispatch: {}

jobs:
  harvest:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run daily harvester
        env:
          AIRTABLE_TOKEN: ${{ secrets.AIRTABLE_TOKEN }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          PYTHONUNBUFFERED: "1"
        run: python -u scripts/harvest_reddit.py
# Daily harvest workflow for AI Harm Watch.
